              <span style="background:${c.bg};color:${c.fg};font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:3px 9px;border-radius:6px;">${c.label}</span>
            </div>
            <div style="font-weight:600;font-size:14.5px;line-height:1.35;margin-bottom:7px;">${item.title}</div>
            <div style="margin-bottom:7px;">${topics}</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">
              <span style="font-weight:600;color:var(--ink);">${item.source}</span> &nbsp;|&nbsp; ${item.date}
            </div>
            <div class="summary-text" style="font-size:13px;color:#3a4252;line-height:1.55;margin-bottom:10px;max-height:3.1em;overflow:hidden;transition:max-height .25s ease;">${item.summary}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
              <a href="javascript:void(0)" class="view-more" style="font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:1px;transition:color .15s;">View More</a>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="read-original" style="font-size:12.5px;color:var(--ink-soft);text-decoration:none;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:color .15s;">
                Read original
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            </div>
          </div>
        </div>`;
      });
    }
    list.innerHTML = html;
  }

  // expand / collapse
  list.addEventListener('click', e => {
    const btn = e.target.closest('.view-more');
    if(!btn) return;
    const s = btn.closest('.nf-item').querySelector('.summary-text');
    const open = s.style.maxHeight === 'none';
    s.style.maxHeight = open ? '3.1em' : 'none';
    btn.textContent = open ? 'View More' : 'View Less';
  });

  // tab filter
  tabs.addEventListener('click', e => {
    const b = e.target.closest('.nf-tab');
    if(!b) return;
    active = b.dataset.cat;
    [...tabs.children].forEach(x => x.classList.toggle('active', x === b));
    list.scrollTop = 0;
    render();
  });

  // refresh
  document.getElementById('nf-refresh').addEventListener('click', () => {
    const s = document.getElementById('nf-spin');
    s.style.animation = 'nfspin .6s linear';
    s.addEventListener('animationend', () => s.style.animation = '', {once:true});
    render();
  });

  tabs.querySelector('[data-cat="all"]').classList.add('active');
  render();
})();
</script>
